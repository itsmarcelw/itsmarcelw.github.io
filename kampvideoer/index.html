<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kampvideoer</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --ink: #16181d; --muted: #6b7280; --line: #e3e6eb;
      --accent: #1b4f9c; --accentbg: #eaf0fa; color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101216; --card: #181b21; --ink: #e8eaed; --muted: #9aa1ac; --line: #2a2f38;
        --accent: #7fa8ec; --accentbg: #1c2a44;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 40px 16px 64px; }
    
    /* Tilbage-knap */
    .back-link { display: inline-block; margin-bottom: 24px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
    
    h1 { font-size: 30px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; max-width: 60ch; }
    
    /* Liste med videoer */
    .video-liste { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .video-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; transition: border-color .15s; }
    .video-item:hover { border-color: var(--accent); }
    .video-titel { font-weight: 600; font-size: 16px; margin: 0; }
    .video-dato { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .video-link-tekst { color: var(--accent); font-weight: 600; font-size: 14px; }

  </style>
</head>
<body>
  <div class="wrap">
    <a href="../" class="back-link">← Tilbage til forsiden</a>
    
    <header>
      <h1>Kampvideoer</h1>
      <p class="sub">Her kan du finde optagelser af vores kampe fra sæsonen.</p>
    </header>

    <main>
      <ul class="video-liste">
        <!-- Video 1 -->
        <a href="indsæt-youtube-link-her" target="_blank" class="video-item">
          <div>
            <p class="video-titel">Hjemmekamp mod hold X</p>
            <p class="video-dato">Spillet: 12. oktober 2026</p>
          </div>
          <span class="video-link-tekst">Se video →</span>
        </a>

        <!-- Video 2 -->
        <a href="indsæt-google-drive-link-her" target="_blank" class="video-item">
          <div>
            <p class="video-titel">Udekamp mod hold Y</p>
            <p class="video-dato">Spillet: 5. oktober 2026</p>
          </div>
          <span class="video-link-tekst">Se video →</span>
        </a>
      </ul>
    </main>
  </div>
</body>
</html>
