<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kampvideoer · Holdets Værktøjer</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --ink: #16181d; --muted: #6b7280; --line: #e3e6eb;
      --accent: #1b4f9c; --accentbg: #eaf0fa; --ok: #0f7b4f; --okbg: #e7f5ee; --bad: #a11d1d; --badbg: #fbeaea;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101216; --card: #181b21; --ink: #e8eaed; --muted: #9aa1ac; --line: #2a2f38;
        --accent: #7fa8ec; --accentbg: #1c2a44; --ok: #5fd39b; --okbg: #12291f; --bad: #f08a8a; --badbg: #2b1616;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 40px 16px 64px; }
    
    .back-link { display: inline-block; margin-bottom: 24px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
    
    h1 { font-size: 30px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.02em; }
    .sub { color: var(--muted); font-size: 15px; margin: 0 0 24px; max-width: 60ch; }
    
    /* Kategori Faneblade */
    .category-tabs { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card);
      color: var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .tab-btn:hover { border-color: var(--accent); }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Liste med video-kort */
    .video-liste { list-style: none; padding: 0; margin: 0 0 40px; display: flex; flex-direction: column; gap: 14px; }
    .video-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; color: inherit; display: flex; gap: 16px; cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .video-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    
    .video-thumb {
      width: 150px; height: 95px; background: var(--accentbg); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--accent);
      position: relative; overflow: hidden;
    }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .play-icon {
      position: absolute; width: 36px; height: 36px; background: rgba(0,0,0,0.65);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; padding-left: 2px;
    }
    
    .video-info { padding: 12px 16px 12px 0; display: flex; flex-direction: column; justify-content: center; flex-grow: 1; }
    .video-titel { font-weight: 600; font-size: 16px; margin: 0 0 4px; line-height: 1.3; }
    .video-dato { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    .video-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--accentbg); color: var(--accent); width: fit-content; text-transform: uppercase; }

    .loading-text { color: var(--muted); font-style: italic; }

    /* MODAL VIDEO AFSPILER */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px; backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      width: 100%; max-width: 850px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative; animation: modalIn 0.2s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
    .modal-title { font-size: 18px; margin: 0; line-height: 1.25; }
    .modal-close {
      background: var(--accentbg); color: var(--accent); border: none; border-radius: 50%;
      width: 32px; height: 32px; font-size: 20px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold;
    }
    .modal-close:hover { opacity: 0.8; }
    
    .player-container {
      position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
      border-radius: 10px; background: #000; margin-bottom: 12px;
    }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    
    .modal-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
    .ext-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .ext-link:hover { text-decoration: underline; }

    /* Trænersektion */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-top: 32px; }
    .card h2 { margin-top: 0; font-size: 20px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; color: var(--muted); }
    input[type="text"], input[type="url"], select {
      width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--bg); color: var(--ink);
    }
    .btn {
      padding: 10px 18px; font-size: 14px; font-weight: 600; background: var(--accent);
      color: #fff; border: none; border-radius: 8px; cursor: pointer; display: inline-block;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.9; }

    .lock-card { text-align: center; }
    .lock-form { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .lock-input { width: 130px !important; text-align: center; }
    
    #traener-indhold { display: none; }
    .error-msg { color: var(--bad); font-size: 13px; margin-top: 8px; display: none; font-weight: 600; }
    .status-box { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; display: none; }
    .status-box.success { background: var(--okbg); color: var(--ok); }
    .status-box.error { background: var(--badbg); color: var(--bad); }

    @media (max-width: 480px) {
      .video-card { flex-direction: column; gap: 0; }
      .video-thumb { width: 100%; height: 160px; }
      .video-info { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../" class="back-link">← Tilbage til forsiden</a>
    
    <header>
      <h1>Kampvideoer</h1>
      <p class="sub">Her kan du finde og se optagelser af vores kampe direkte på siden.</p>
    </header>

    <main>
      <!-- SÆSON / KATEGORI FANEBLADE -->
      <nav class="category-tabs">
        <button class="tab-btn active" onclick="filtrerKategori('Kampe 26/27', this)">Kampe 26/27</button>
        <button class="tab-btn" onclick="filtrerKategori('Træningskampe 26/27', this)">Træningskampe 26/27</button>
        <button class="tab-btn" onclick="filtrerKategori('Kampe 25/26', this)">Kampe 25/26</button>
        <button class="tab-btn" onclick="filtrerKategori('Træningskampe 25/26', this)">Træningskampe 25/26</button>
        <button class="tab-btn" onclick="filtrerKategori('Alle', this)">Alle</button>
      </nav>

      <!-- LISTE OVER VIDEOER -->
      <ul class="video-liste" id="video-liste">
        <li class="loading-text" id="loading-msg">Henter kampvideoer...</li>
      </ul>

      <!-- TRÆNERADGANG / LÅSESKÆRM -->
      <section class="card lock-card" id="laas-boks">
        <h2>🔒 Træneradgang</h2>
        <p style="color: var(--muted); font-size: 14px;">Lås op for at tilføje nye kampvideoer til listen.</p>
        <form class="lock-form" onsubmit="tjekKode(event)">
          <input type="password" id="kode-input" class="lock-input" placeholder="Kode" autocomplete="off">
          <button type="submit" class="btn">Lås op</button>
        </form>
        <div id="fejl-tekst" class="error-msg">Forkert kode.</div>
      </section>

      <!-- FORMULAR TIL AT TILFØJE VIDEOER -->
      <section class="card" id="traener-indhold">
        <h2>📹 Tilføj ny kampvideo</h2>
        <form onsubmit="tilfoejVideo(event)">
          <div class="form-group">
            <label for="kategori">Vælg Kategori / Sæson</label>
            <select id="kategori" required>
              <option value="Kampe 26/27">Kampe 26/27</option>
              <option value="Træningskampe 26/27">Træningskampe 26/27</option>
              <option value="Kampe 25/26">Kampe 25/26</option>
              <option value="Træningskampe 25/26">Træningskampe 25/26</option>
            </select>
          </div>
          <div class="form-group">
            <label for="titel">Kamp / Titel</label>
            <input type="text" id="titel" placeholder="f.eks. Hjemmekamp mod Randers" required>
          </div>
          <div class="form-group">
            <label for="dato">Dato / Info</label>
            <input type="text" id="dato" placeholder="f.eks. Spillet: 15. oktober 2026" required>
          </div>
          <div class="form-group">
            <label for="link">Video Link (YouTube, Google Drive, VEO osv.)</label>
            <input type="url" id="link" placeholder="https://..." required>
          </div>
          <button type="submit" id="submit-btn" class="btn">Tilføj Video</button>
        </form>

        <div id="status-msg" class="status-box"></div>
      </section>
    </main>
  </div>

  <!-- MODAL POPUP VIDEO AFSPILER -->
  <div class="modal-overlay" id="video-modal" onclick="lukModalPaaBaggrund(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-titel">Kampvideo</h3>
        <button class="modal-close" onclick="lukModal()">✕</button>
      </div>
      <div class="player-container">
        <iframe id="modal-iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="modal-footer">
        <span id="modal-dato"></span>
        <a id="modal-ext-link" href="#" target="_blank" class="ext-link">Åbn eksternt link ↗</a>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz456XrAofoqV0uBnYEWzldXj91MSaOpeqxN8g3prFH-slS6lk73Q9s7pMjjXTAKg5V/exec";
    const TRÆNER_KODE = "8296";

    let alleVideoer = [];
    let valgtKategori = "Kampe 26/27";

    function hentYouTubeThumbnail(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://img.youtube.com/vi/${match[2]}/hqdefault.jpg` : null;
    }

    // Genererer et indlejringssurface (embed URL) til afspilleren
    function hentEmbedUrl(url) {
      if (!url) return null;
      
      // YouTube
      const ytMatch = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      if (ytMatch && ytMatch[2].length === 11) {
        return `https://www.youtube-nocookie.com/embed/${ytMatch[2]}?autoplay=1`;
      }
      
      // Google Drive
      const gdMatch = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
      if (gdMatch && gdMatch[1]) {
        return `https://drive.google.com/file/d/${gdMatch[1]}/preview`;
      }
      
      // Direkte link hvis det allerede er et embed link
      if (url.includes("/embed/")) return url;
      
      return url;
    }

    async function hentVideoer() {
      const container = document.getElementById("video-liste");
      try {
        const response = await fetch(APPS_SCRIPT_URL + "?v=" + Date.now(), { cache: "no-store" });
        alleVideoer = await response.json();
        visVideoer();
      } catch (err) {
        container.innerHTML = '<li class="loading-text" style="color: var(--bad);">Der opstod en fejl ved indlæsning af videoer.</li>';
      }
    }

    function filtrerKategori(kat, btnElement) {
      valgtKategori = kat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      visVideoer();
    }

    function visVideoer() {
      const container = document.getElementById("video-liste");
      container.innerHTML = "";

      const filtrerede = valgtKategori === "Alle" 
        ? alleVideoer 
        : alleVideoer.filter(v => {
            const kat = (v.kategori && String(v.kategori).trim() !== "") ? String(v.kategori).trim() : "Kampe 26/27";
            return kat.toLowerCase() === valgtKategori.trim().toLowerCase();
          });

      if (!filtrerede || filtrerede.length === 0) {
        container.innerHTML = `<li class="loading-text">Ingen kampvideoer fundet under '${valgtKategori}'.</li>`;
        return;
      }

      [...filtrerede].reverse().forEach(v => {
        const thumbUrl = hentYouTubeThumbnail(v.link);
        const div = document.createElement("div");
        div.className = "video-card";
        div.onclick = () => aabnModal(v);
        
        const thumbHTML = thumbUrl 
          ? `<div class="video-thumb"><img src="${thumbUrl}" alt="Thumbnail" loading="lazy"><div class="play-icon">▶</div></div>`
          : `<div class="video-thumb">🎥<div class="play-icon">▶</div></div>`;

        const katNavn = (v.kategori && String(v.kategori).trim() !== "") ? String(v.kategori).trim() : "Kampe 26/27";

        div.innerHTML = `
          ${thumbHTML}
          <div class="video-info">
            <span class="video-tag">${katNavn}</span>
            <p class="video-titel">${v.titel}</p>
            <p class="video-dato">${v.dato}</p>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Modal Video Afspiller Funktioner
    function aabnModal(video) {
      const embedUrl = hentEmbedUrl(video.link);
      document.getElementById("modal-titel").textContent = video.titel;
      document.getElementById("modal-dato").textContent = video.dato;
      document.getElementById("modal-ext-link").href = video.link;
      document.getElementById("modal-iframe").src = embedUrl;
      document.getElementById("video-modal").classList.add("open");
      document.body.style.overflow = "hidden"; // Forhindrer baggrundsscroll
    }

    function lukModal() {
      document.getElementById("video-modal").classList.remove("open");
      document.getElementById("modal-iframe").src = ""; // Stopper lyden/videoen
      document.body.style.overflow = "";
    }

    function lukModalPaaBaggrund(e) {
      if (e.target.id === "video-modal") {
        lukModal();
      }
    }

    // Luk modal med ESC-tasten
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") lukModal();
    });

    async function tilfoejVideo(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const statusMsg = document.getElementById("status-msg");
      
      btn.disabled = true;
      btn.textContent = "Gemmer video...";
      statusMsg.style.display = "none";

      const nyVideo = {
        kategori: document.getElementById("kategori").value,
        titel: document.getElementById("titel").value,
        dato: document.getElementById("dato").value,
        link: document.getElementById("link").value
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(nyVideo)
        });
        
        const res = await response.json();
        if (res.status === "success") {
          statusMsg.className = "status-box success";
          statusMsg.textContent = "✓ Videoen er gemt og tilføjet til siden!";
          statusMsg.style.display = "block";
          e.target.reset();
          hentVideoer();
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        statusMsg.className = "status-box error";
        statusMsg.textContent = "❌ Der opstod en fejl. Tjek linket og prøv igen.";
        statusMsg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Tilføj Video";
      }
    }

    function tjekKode(e) {
      e.preventDefault();
      const input = document.getElementById("kode-input").value;
      if (input === TRÆNER_KODE) {
        sessionStorage.setItem("video_traener_godkendt", "true");
        visIndhold();
      } else {
        document.getElementById("fejl-tekst").style.display = "block";
      }
    }

    function visIndhold() {
      document.getElementById("laas-boks").style.display = "none";
      document.getElementById("traener-indhold").style.display = "block";
    }

    if (sessionStorage.getItem("video_traener_godkendt") === "true") {
      visIndhold();
    }

    hentVideoer();
  </script>
</body>
</html>
